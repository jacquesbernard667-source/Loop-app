<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="LOOP — your personal offline task assistant">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>LOOP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="logo">↻</div><div><h1>LOOP</h1><small>your day, in motion</small></div></div>
  <div class="top-actions"><button id="themeBtn" class="iconbtn" aria-label="Toggle theme">☾</button><button id="installBtn" class="iconbtn hidden">＋ Install</button></div>
</header>
<section id="authPanel" class="panel auth">
  <div class="eyebrow">YOUR PERSONAL SPACE</div><h2>Tasks that stay yours.</h2><p class="muted">Create an account to sync your tasks across devices. You can also use LOOP offline on this device.</p>
  <label>Email<input id="email" type="email" autocomplete="email" placeholder="you@example.com"></label>
  <label>Password<input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters"></label>
  <div class="authbuttons"><button id="loginBtn" class="primary">Log in</button><button id="signupBtn" class="secondary">Create account</button></div>
  <button id="guestBtn" class="textbtn">Continue offline without an account</button>
  <p id="authMsg" class="message"></p>
</section>
<section id="mainPanel" class="hidden">
  <div class="welcome"><div><div class="eyebrow">TODAY</div><h2 id="greeting">Let's get things done.</h2><p id="dateText" class="muted"></p></div><div class="sync" id="syncStatus">Offline mode</div></div>
  <div class="stats"><div class="stat"><span id="totalCount">0</span><small>Total</small></div><div class="stat"><span id="doneCount">0</span><small>Done</small></div><div class="stat"><span id="pendingCount">0</span><small>To do</small></div></div>
  <section class="panel addpanel">
    <div class="panelhead"><h3>New task</h3><span class="muted">Quick capture</span></div>
    <form id="taskForm">
      <input id="taskTitle" maxlength="140" required placeholder="What do you need to do?">
      <div class="formgrid"><select id="category"><option value="auto">✨ Auto category</option><option>School</option><option>Shopping</option><option>Work</option><option>Personal</option><option>Health</option><option>Other</option></select><select id="priority"><option value="normal">Normal priority</option><option value="high">Important</option></select></div>
      <div class="formgrid"><input id="dueDate" type="date"><input id="dueTime" type="time"></div>
      <button class="primary full" type="submit">＋ Add task</button>
    </form>
  </section>
  <div class="sectionhead"><h3>Your lists</h3><button id="voiceAll" class="secondary small">🔊 Read my day</button></div>
  <div class="filters" id="filters"></div>
  <div id="taskList" class="tasklist"></div>
  <div class="accountbar"><span id="userLabel">Offline user</span><button id="logoutBtn" class="textbtn">Log out</button></div>
</section>
<div id="toast" class="toast"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
