<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101522">
<title>LOOP</title>

<style> 
*{box-sizing:border-box}
:root{
--bg:#f4f6fb;--card:#fff;--text:#182033;
--muted:#7c8498;--accent:#7163ef;--border:#e7eaf2; 
}
.dark{
--bg:#0d1220;--card:#171e2e;--text:#f2f4fa;
--muted:#9ca6bb;--accent:#9b8cff;--border:#283247;
}
body{
margin:0;background:var(--bg);color:var(--text);
font-family:Arial,sans-serif;transition:.3s;
}
.app{max-width:800px;margin:auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:26px;font-weight:bold;letter-spacing:2px}
.logo span{color:var(--accent)}
button{
border:none;border-radius:12px;padding:12px;
background:var(--card);color:var(--text);
cursor:pointer;font-weight:bold;
}
.primary{background:var(--accent);color:white}
.card{
background:var(--card);padding:20px;border-radius:20px;
border:1px solid var(--border);margin-top:15px;
}
h1{font-size:32px;margin:25px 0 5px}
.subtitle{color:var(--muted)}
.stats{display:flex;gap:10px;margin-top:20px}
.stat{flex:1;background:var(--card);padding:15px;border-radius:15px}
.stat strong{display:block;font-size:25px;margin-top:8px}
input,select,textarea{
width:100%;padding:13px;margin:6px 0;
border-radius:12px;border:1px solid var(--border);
background:var(--bg);color:var(--text);outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.task{
display:flex;align-items:center;gap:12px;
padding:14px 0;border-bottom:1px solid var(--border);
}
.task:last-child{border:none}
.task .info{flex:1}
.task-title{font-weight:bold}
.task small{color:var(--muted)}
.done{text-decoration:line-through;opacity:.5}
.delete{color:#ef5969;background:transparent}
.priority{font-size:11px;color:var(--accent)}
.form{display:grid;gap:5px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.switch{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
#tasks{margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:25px}
</style>
</head>

<body>
<div class="app">

<header>
<div class="logo">L<span>OO</span>P</div>
<button onclick="toggleTheme()" id="themeBtn">☀️</button>
</header>

<h1>Stay on track.</h1>
<p class="subtitle">One thing at a time. You've got this.</p>

<div class="stats">
<div class="stat">To do<strong id="remaining">0</strong></div>
<div class="stat">Completed<strong id="completed">0</strong></div>
<div class="stat">Today<strong id="today">0</strong></div>
</div>

<div class="card">
<h2>➕ Add a task</h2>

<form id="form" class="form">
<input id="title" placeholder="What do you need to do?" required>

<div class="row">
<input id="date" type="date">
<input id="time" type="time">
</div>

<div class="row">
<select id="priority">
<option value="Important">🔥 Important</option>
<option value="Normal" selected>Normal</option>
<option value="Whenever">Whenever</option>
</select>

<select id="category">
<option>Personal</option>
<option>School</option>
<option>Work</option>
<option>Health</option>
<option>Other</option>
</select>
</div>

<textarea id="notes" placeholder="Extra details (optional)"></textarea>

<button class="primary">＋ Add task</button>
</form>
</div>

<div class="card">
<h2>📋 Your tasks</h2>
<div id="tasks"></div>
</div>

<div class="card">
<h2>🔔 Smart reminders</h2>

<div class="switch">
<span>Notifications</span>
<button onclick="enableNotifications()">Enable</button>
</div>

<div class="switch">
<span>Voice reminders</span>
<input type="checkbox" id="voiceEnabled" checked>
</div>

<label>Voice</label>
<select id="voice"></select>

<button onclick="testVoice()" style="width:100%">
▶ Test voice
</button>

<p class="subtitle">
Voice availability depends on your device.
</p>
</div>

</div>

<script>
const KEY="loop_tasks";
const SETTINGS="loop_settings";

let tasks=JSON.parse(localStorage.getItem(KEY)||"[]");
let settings=JSON.parse(localStorage.getItem(SETTINGS)||'{"dark":true,"voice":true}');
let voices=[];

function save(){
localStorage.setItem(KEY,JSON.stringify(tasks));
render();
}

function saveSettings(){
localStorage.setItem(SETTINGS,JSON.stringify(settings));
}

function toggleTheme(){
settings.dark=!settings.dark;
saveSettings();
applyTheme();
}

function applyTheme(){
document.body.classList.toggle("dark",settings.dark);
document.getElementById("themeBtn").textContent=
settings.dark?"☀️":"🌙";
}

applyTheme();

function render(){
let open=tasks.filter(t=>!t.done);
let done=tasks.filter(t=>t.done);

document.getElementById("remaining").textContent=open.length;
document.getElementById("completed").textContent=done.length;

document.getElementById("today").textContent=
open.filter(t=>t.date===new Date().toISOString().slice(0,10)).length;

let list=document.getElementById("tasks");

if(!open.length){
list.innerHTML='<div class="empty">✨ Nothing to worry about.<br>Add a task to get started.</div>';
return;
}

list.innerHTML=open.map(t=>`
<div class="task">
<input type="checkbox" onchange="completeTask('${t.id}')">
<div class="info">
<div class="task-title">${escapeHTML(t.title)}</div>
<small>
${t.date||"No date"} ${t.time||""}
 · ${t.category}
</small><br>
<span class="priority">${t.priority}</span>
</div>
<button class="delete" onclick="deleteTask('${t.id}')">✕</button>
</div>
`).join("");
}

function escapeHTML(s){
return String(s).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
}[c]));
}

document.getElementById("form").onsubmit=function(e){
e.preventDefault();

let task={
id:Date.now().toString(),
title:document.getElementById("title").value.trim(),
date:document.getElementById("date").value,
time:document.getElementById("time").value,
priority:document.getElementById("priority").value,
category:document.getElementById("category").value,
notes:document.getElementById("notes").value,
done:false,
notified:false
};

tasks.unshift(task);
save();
this.reset();
};

function completeTask(id){
let t=tasks.find(t=>t.id===id);
if(t){
t.done=true;
save();
}
}

function deleteTask(id){
tasks=tasks.filter(t=>t.id!==id);
save();
}

function enableNotifications(){
if(!("Notification"in window)){
alert("Notifications aren't supported by this browser.");
return;
}

Notification.requestPermission().then(permission=>{
if(permission==="granted"){
alert("Notifications enabled!");
}
});
}

function loadVoices(){
if(!("speechSynthesis"in window))return;

voices=speechSynthesis.getVoices();
let select=document.getElementById("voice");

select.innerHTML=voices.map((v,i)=>
`<option value="${i}">${v.name} (${v.lang})</option>`
).join("");

let preferred=voices.findIndex(v=>
/male|david|daniel|alex|fred|john|mark|tom/i.test(v.name)
&&v.lang.startsWith("en")
);

if(preferred>=0)select.value=preferred;
}

if("speechSynthesis"in window){
loadVoices();
speechSynthesis.onvoiceschanged=loadVoices;
}

function speak(text){
if(!settings.voice)return;
if(!("speechSynthesis"in window))return;

speechSynthesis.cancel();

let utterance=new SpeechSynthesisUtterance(text);
utterance.rate=.92;
utterance.pitch=.85;
utterance.volume=1;

let selected=voices[document.getElementById("voice").value];
if(selected)utterance.voice=selected;

speechSynthesis.speak(utterance);
}

document.getElementById("voiceEnabled").checked=settings.voice;

document.getElementById("voiceEnabled").onchange=function(){
settings.voice=this.checked;
saveSettings();
};

function testVoice(){
speak("Hello. This is LOOP. You have a few things to do today. And in addition, you have other tasks waiting. But the most important thing, don't forget to complete your most important task.");
}

function checkReminders(){
if(!("Notification"in window))return;
if(Notification.permission!=="granted")return;

let now=new Date();

tasks.forEach(t=>{
if(t.done||t.notified||!t.date||!t.time)return;

let due=new Date(t.date+"T"+t.time);

if(due<=now && due>new Date(now.getTime()-60000)){
new Notification("LOOP — Reminder",{
body:"You have "+t.title+". Don't forget!",
icon:"icon-192.png"
});

t.notified=true;
localStorage.setItem(KEY,JSON.stringify(tasks));

speak("You have "+t.title+" to do. And in addition, you have other tasks. But the most important thing, don't forget to "+t.title+".");
}
});
}

setInterval(checkReminders,30000);

render();
</script>
</body>
</html>
